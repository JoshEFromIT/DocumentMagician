[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-magician"
version = "0.1.0"
description = "Local-first technical document generator using Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
document-magician = "document_magician.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
